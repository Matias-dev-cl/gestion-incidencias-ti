{% extends "base.html" %}
{% block titulo %}Pagina no encontrada{% endblock %}
{% block contenido %}
<div class="mx-auto max-w-md py-16 text-center">
  <p class="text-6xl font-bold text-slate-300">404</p>
  <h1 class="mt-4 text-xl font-semibold text-slate-900">Esto no existe, o no es tuyo</h1>
  <p class="mt-2 text-sm text-slate-500">
    El ticket o el equipo que buscas no existe, o no esta dentro de lo que tu cuenta puede ver.
  </p>
  <div class="mt-6 flex justify-center gap-3">
    <a href="{% url 'tickets:dashboard' %}" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700">Ir al dashboard</a>
    <a href="{% url 'tickets:lista' %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm hover:bg-slate-50">Ver mis tickets</a>
  </div>
</div>
{% endblock %}
