<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium
  {% if estado == 'ABIERTO' %}bg-sky-100 text-sky-800
  {% elif estado == 'EN_PROGRESO' %}bg-amber-100 text-amber-800
  {% elif estado == 'EN_ESPERA' %}bg-violet-100 text-violet-800
  {% elif estado == 'RESUELTO' %}bg-emerald-100 text-emerald-800
  {% else %}bg-slate-200 text-slate-700{% endif %}">{{ etiqueta }}</span>
